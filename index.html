<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Đếm Ngược THPT 2026 — Võ Minh Triết</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --font-ui:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:var(--font-ui);
  background:#07090f;
  color:white;
}

body{
  overflow-x:hidden;
  overflow-y:auto;
}

#bg-img{
  position:fixed;
  inset:0;
  z-index:0;
  background:url("https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?q=80&w=1920") center/cover no-repeat;
  filter:blur(2px) brightness(.25);
}

#bg-canvas{
  position:fixed;
  inset:0;
  z-index:1;
}

#vignette{
  position:fixed;
  inset:0;
  z-index:2;
  background:radial-gradient(circle,transparent 35%,rgba(7,9,15,.8));
}

.page{
  position:relative;
  z-index:3;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:24px 14px;
}

.card{
  width:100%;
  max-width:700px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  border-radius:28px;
  backdrop-filter:blur(20px);
  padding:30px 22px;
}

.badge-school{
  display:inline-block;
  font-size:11px;
  color:#38bdf8;
  margin-bottom:14px;
}

.main-title{
  font-size:28px;
  font-weight:700;
  text-align:center;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  font-size:12px;
  color:#94a3b8;
  margin-bottom:22px;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:18px;
}

.tab{
  border:none;
  padding:9px 14px;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,.05);
  color:white;
}

.tab.active{
  background:#2563eb;
}

.info-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}

.info-dot{
  width:8px;
  height:8px;
  border-radius:50%;
}

.info-chip{
  font-size:14px;
  color:#cbd5e1;
}

.prog-track{
  width:100%;
  height:4px;
  border-radius:99px;
  background:rgba(255,255,255,.08);
  overflow:hidden;
  margin-bottom:20px;
}

.prog-fill{
  height:100%;
  width:0%;
}

.clock-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.clock-box{
  background:rgba(0,0,0,.28);
  border-radius:14px;
  text-align:center;
  padding:18px 10px;
}

.clock-num{
  font-family:var(--font-mono);
  font-size:42px;
  font-weight:700;
}

.clock-lbl{
  margin-top:8px;
  font-size:12px;
  color:#94a3b8;
}

.finish-msg{
  display:none;
  text-align:center;
  font-size:22px;
  padding:20px;
  color:#34d399;
}

.links-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin-top:24px;
}

.link-btn{
  text-decoration:none;
  color:white;
  padding:10px 16px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
}

.footer-row{
  margin-top:20px;
  text-align:center;
  font-size:12px;
  color:#94a3b8;
}

@media(max-width:520px){
  .clock-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .clock-num{
    font-size:32px;
  }

  .main-title{
    font-size:22px;
  }
}
</style>
</head>
<body>

<div id="bg-img"></div>
<canvas id="bg-canvas"></canvas>
<div id="vignette"></div>

<div class="page">
<div class="card" id="card">

<div class="badge-school">
HCMUS — ĐH Khoa học Tự nhiên
</div>

<h1 class="main-title">🎓 Đếm Ngược THPT Quốc Gia 2026</h1>

<p class="subtitle">
Khối A00 & A01 · Võ Minh Triết
</p>

<div class="tabs" id="tabs">
<button class="tab active" data-m="all">📋 Thủ tục</button>
<button class="tab" data-m="toan">∫ Toán</button>
<button class="tab" data-m="ly">⚛ Vật lý</button>
<button class="tab" data-m="hoa">🧪 Hóa</button>
<button class="tab" data-m="anh">🔤 Tiếng Anh</button>
</div>

<div class="info-row">
<div class="info-dot" id="dot"></div>
<div class="info-chip" id="chip"></div>
</div>

<div class="prog-track">
<div class="prog-fill" id="prog"></div>
</div>

<div class="clock-grid" id="clock">
<div class="clock-box"><div class="clock-num" id="cd-d">00</div><div class="clock-lbl">Ngày</div></div>
<div class="clock-box"><div class="clock-num" id="cd-h">00</div><div class="clock-lbl">Giờ</div></div>
<div class="clock-box"><div class="clock-num" id="cd-m">00</div><div class="clock-lbl">Phút</div></div>
<div class="clock-box"><div class="clock-num" id="cd-s">00</div><div class="clock-lbl">Giây</div></div>
</div>

<div class="finish-msg" id="done">
🎉 Đã tới giờ!
</div>

<div class="links-row">
<a class="link-btn" href="https://hcmus.edu.vn" target="_blank">🏛️ HCMUS</a>
<a class="link-btn" href="https://tuyensinh.hcmus.edu.vn" target="_blank">🎓 Tuyển sinh</a>
<a class="link-btn" href="https://tuyensinh.hcmus.edu.vn/2025-diem-chuan-cac-phuong-thuc/" target="_blank">📊 Điểm chuẩn</a>
</div>

<div class="footer-row">
✦ Good Luck — Võ Minh Triết ✦
</div>

</div>
</div>

<script>
const CFG={
all:{
date:"2026-06-10T14:00:00",
dot:"#34d399",
prog:"#34d399",
note:"Chiều 10/06/2026 — 14:00 · Làm thủ tục dự thi"
},
toan:{
date:"2026-06-11T14:30:00",
dot:"#f87171",
prog:"#f87171",
note:"Chiều 11/06/2026 — 14:30 · Môn Toán"
},
ly:{
date:"2026-06-12T07:35:00",
dot:"#38bdf8",
prog:"#38bdf8",
note:"Sáng 12/06/2026 — 07:35 · Vật lý"
},
hoa:{
date:"2026-06-12T08:40:00",
dot:"#34d399",
prog:"#34d399",
note:"Sáng 12/06/2026 — 08:40 · Hóa học"
},
anh:{
date:"2026-06-12T08:40:00",
dot:"#fbbf24",
prog:"#fbbf24",
note:"Sáng 12/06/2026 — 08:40 · Tiếng Anh · Phát đề 08:35 · 50 phút"
}
};

let cur="all";
let timer=null;

function pad(n){
return n<10?"0"+n:n;
}

function tick(){
const end=new Date(CFG[cur].date).getTime();
const now=Date.now();
const diff=end-now;

if(diff<=0){
document.getElementById("clock").style.display="none";
document.getElementById("done").style.display="block";
return;
}

document.getElementById("clock").style.display="grid";
document.getElementById("done").style.display="none";

document.getElementById("cd-d").textContent=pad(Math.floor(diff/86400000));
document.getElementById("cd-h").textContent=pad(Math.floor(diff%86400000/3600000));
document.getElementById("cd-m").textContent=pad(Math.floor(diff%3600000/60000));
document.getElementById("cd-s").textContent=pad(Math.floor(diff%60000/1000));
}

function setMode(m){
cur=m;
document.getElementById("dot").style.background=CFG[m].dot;
document.getElementById("chip").innerHTML=CFG[m].note;
document.getElementById("prog").style.background=CFG[m].prog;

document.querySelectorAll(".tab").forEach(btn=>{
btn.classList.remove("active");
if(btn.dataset.m===m) btn.classList.add("active");
});

clearInterval(timer);
tick();
timer=setInterval(tick,1000);
}

document.querySelectorAll(".tab").forEach(btn=>{
btn.onclick=()=>setMode(btn.dataset.m);
});

setMode("all");
</script>

</body>
</html>
