<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Đếm Ngược THPT 2026 — Võ Minh Triết</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
  --font-ui:'Space Grotesk',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:var(--font-ui);
  background:#07090f;
  color:white;
  overflow-x:hidden;
  overflow-y:auto;
}

#bg-img{
  position:fixed;
  inset:0;
  z-index:0;
  background:url("https://images.unsplash.com/photo-1614741118887-7a4ee193a5fa?q=80&w=1920") center/cover no-repeat;
  filter:blur(2px) brightness(.22);
}

#particles{
  position:fixed;
  inset:0;
  z-index:1;
  pointer-events:none;
  overflow:hidden;
}

.particle{
  position:absolute;
  border-radius:50%;
  background:rgba(255,255,255,0.12);
  animation:floatUp linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(100vh) scale(0);opacity:0;}
  10%{opacity:1;}
  90%{opacity:0.6;}
  100%{transform:translateY(-10vh) scale(1);opacity:0;}
}

#vignette{
  position:fixed;
  inset:0;
  z-index:2;
  background:radial-gradient(ellipse at center,transparent 20%,rgba(7,9,15,.75) 75%);
}

.page{
  position:relative;
  z-index:3;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px 16px;
}

.card{
  width:100%;
  max-width:680px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  padding:28px 20px 24px;
  box-shadow:0 0 60px rgba(37,99,235,.12), inset 0 1px 0 rgba(255,255,255,.08);
}

.badge-school{
  display:inline-flex;
  align-items:center;
  gap:6px;
  font-size:11px;
  font-weight:600;
  color:#38bdf8;
  letter-spacing:.06em;
  text-transform:uppercase;
  margin-bottom:16px;
}

.badge-school::before{
  content:'';
  display:inline-block;
  width:6px;
  height:6px;
  border-radius:50%;
  background:#38bdf8;
  box-shadow:0 0 8px #38bdf8;
  animation:pulse-dot 2s ease infinite;
}

@keyframes pulse-dot{
  0%,100%{opacity:1;transform:scale(1);}
  50%{opacity:.5;transform:scale(1.4);}
}

.main-title{
  font-size:clamp(20px,6vw,28px);
  font-weight:700;
  text-align:center;
  margin-bottom:6px;
  line-height:1.25;
  letter-spacing:-.01em;
}

.subtitle{
  text-align:center;
  font-size:12px;
  color:#94a3b8;
  margin-bottom:22px;
  letter-spacing:.03em;
}

.tabs{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
  margin-bottom:20px;
}

.tab{
  border:1px solid rgba(255,255,255,.1);
  padding:9px 15px;
  border-radius:12px;
  cursor:pointer;
  background:rgba(255,255,255,.05);
  color:rgba(255,255,255,.75);
  font-family:var(--font-ui);
  font-size:13px;
  font-weight:500;
  transition:all .2s ease;
  -webkit-tap-highlight-color:transparent;
}

.tab:hover{background:rgba(255,255,255,.1);color:white;}

.tab.active{
  background:#2563eb;
  border-color:#3b82f6;
  color:white;
  box-shadow:0 0 16px rgba(37,99,235,.4);
}

.info-row{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
}

.info-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  flex-shrink:0;
  transition:background .3s;
  animation:glow-pulse 2s ease infinite;
}

@keyframes glow-pulse{
  0%,100%{opacity:1;}
  50%{opacity:.4;}
}

.info-chip{font-size:13px;color:#cbd5e1;line-height:1.4;}

.prog-track{
  width:100%;
  height:5px;
  border-radius:99px;
  background:rgba(255,255,255,.07);
  overflow:hidden;
  margin-bottom:22px;
}

.prog-fill{
  height:100%;
  width:0%;
  border-radius:99px;
  transition:width 1s ease, background .3s;
}

.clock-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}

.clock-box{
  background:rgba(0,0,0,.32);
  border:1px solid rgba(255,255,255,.07);
  border-radius:16px;
  text-align:center;
  padding:18px 8px;
  position:relative;
  overflow:hidden;
  transition:background .15s;
}

.clock-box.bump{background:rgba(255,255,255,.07);}

.clock-num{
  font-family:var(--font-mono);
  font-size:clamp(30px,9vw,46px);
  font-weight:700;
  letter-spacing:-.02em;
  line-height:1;
}

.clock-lbl{
  margin-top:8px;
  font-size:11px;
  color:#64748b;
  letter-spacing:.08em;
  text-transform:uppercase;
  font-weight:500;
}

/* FINISH OVERLAY */
#finish-overlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(7,9,15,.96);
  justify-content:center;
  align-items:center;
  flex-direction:column;
  gap:28px;
}

#finish-overlay.visible{display:flex;}

.done-word{
  font-family:var(--font-mono);
  font-size:clamp(56px,18vw,100px);
  font-weight:700;
  letter-spacing:-.04em;
  color:#34d399;
  opacity:0;
  transform:scale(.85) translateY(12px);
  transition:opacity .7s ease, transform .7s ease;
  text-shadow:0 0 40px rgba(52,211,153,.45);
}

.done-word.show{opacity:1;transform:scale(1) translateY(0);}
.done-word.fade-out{opacity:0;transform:scale(1.08) translateY(-8px);transition:opacity .6s ease,transform .6s ease;}

.done-msg{
  max-width:360px;
  text-align:center;
  font-size:clamp(16px,4.5vw,20px);
  line-height:1.65;
  color:#e2e8f0;
  opacity:0;
  transform:translateY(16px);
  padding:0 24px;
  transition:opacity .8s ease .2s, transform .8s ease .2s;
}

.done-msg.show{opacity:1;transform:translateY(0);}
.done-msg strong{color:#34d399;font-weight:700;}

.done-stars{
  font-size:28px;
  opacity:0;
  transition:opacity .8s ease .5s;
  letter-spacing:8px;
}

.done-stars.show{opacity:1;}

#confetti-canvas{
  position:fixed;
  inset:0;
  z-index:99;
  pointer-events:none;
  display:none;
}

.links-row{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:8px;
  margin-top:22px;
}

.link-btn{
  text-decoration:none;
  color:rgba(255,255,255,.8);
  padding:10px 16px;
  border-radius:12px;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
  font-size:13px;
  transition:all .2s;
}

.link-btn:hover{background:rgba(255,255,255,.12);color:white;}

.footer-row{
  margin-top:20px;
  text-align:center;
  font-size:12px;
  color:#475569;
  letter-spacing:.05em;
}

@media(max-width:480px){
  .clock-grid{grid-template-columns:repeat(2,1fr);gap:12px;}
  .card{padding:22px 16px 20px;border-radius:22px;}
  .tab{font-size:12px;padding:9px 13px;}
}
</style>
</head>
<body>

<div id="bg-img"></div>
<div id="particles" aria-hidden="true"></div>
<div id="vignette"></div>

<div id="finish-overlay" role="dialog" aria-live="polite">
  <div class="done-word" id="done-word">Done</div>
  <div class="done-msg" id="done-msg">
    <strong>Always be yourself.</strong><br>
    Hãy sống hạnh phúc nhé.<br>
    Hãy tận hưởng kỳ nghỉ thư giãn<br>nhất cuộc đời này nhé 🌿
  </div>
  <div class="done-stars" id="done-stars">✦ ✦ ✦</div>
</div>

<canvas id="confetti-canvas"></canvas>

<div class="page">
<div class="card">

  <div class="badge-school">HCMUS — ĐH Khoa học Tự nhiên</div>
  <h1 class="main-title">🎓 Đếm Ngược THPT Quốc Gia 2026</h1>
  <p class="subtitle">Khối A00 &amp; A01 · Võ Minh Triết</p>

  <div class="tabs" id="tabs">
    <button class="tab active" data-m="all">📋 Thủ tục</button>
    <button class="tab" data-m="toan">∫ Toán</button>
    <button class="tab" data-m="ly">⚛ Vật lý</button>
    <button class="tab" data-m="hoa">🧪 Hóa</button>
    <button class="tab" data-m="anh">🔤 Tiếng Anh</button>
  </div>

  <div class="info-row">
    <div class="info-dot" id="dot"></div>
    <div class="info-chip" id="chip"></div>
  </div>

  <div class="prog-track">
    <div class="prog-fill" id="prog"></div>
  </div>

  <div class="clock-grid" id="clock">
    <div class="clock-box"><div class="clock-num" id="cd-d">00</div><div class="clock-lbl">Ngày</div></div>
    <div class="clock-box"><div class="clock-num" id="cd-h">00</div><div class="clock-lbl">Giờ</div></div>
    <div class="clock-box"><div class="clock-num" id="cd-m">00</div><div class="clock-lbl">Phút</div></div>
    <div class="clock-box"><div class="clock-num" id="cd-s">00</div><div class="clock-lbl">Giây</div></div>
  </div>

  <div class="links-row">
    <a class="link-btn" href="https://hcmus.edu.vn" target="_blank">🏛️ HCMUS</a>
    <a class="link-btn" href="https://tuyensinh.hcmus.edu.vn" target="_blank">🎓 Tuyển sinh</a>
    <a class="link-btn" href="https://tuyensinh.hcmus.edu.vn/2025-diem-chuan-cac-phuong-thuc/" target="_blank">📊 Điểm chuẩn</a>
  </div>

  <div class="footer-row">✦ Good Luck — Võ Minh Triết ✦</div>

</div>
</div>

<script>
const CFG={
  all:{date:"2026-06-10T14:00:00",dot:"#34d399",prog:"#34d399",note:"Chiều 10/06/2026 — 14:00 · Làm thủ tục dự thi"},
  toan:{date:"2026-06-11T14:30:00",dot:"#f87171",prog:"#f87171",note:"Chiều 11/06/2026 — 14:30 · Môn Toán"},
  ly:{date:"2026-06-12T07:35:00",dot:"#38bdf8",prog:"#38bdf8",note:"Sáng 12/06/2026 — 07:35 · Vật lý"},
  hoa:{date:"2026-06-12T08:40:00",dot:"#34d399",prog:"#34d399",note:"Sáng 12/06/2026 — 08:40 · Hóa học"},
  anh:{date:"2026-06-12T08:40:00",dot:"#fbbf24",prog:"#fbbf24",note:"Sáng 12/06/2026 — 08:40 · Tiếng Anh · Phát đề 08:35 · 50 phút"}
};

const EXAM_END=new Date("2026-06-12T09:30:00").getTime();

/* particles */
(function(){
  const wrap=document.getElementById("particles");
  for(let i=0;i<22;i++){
    const p=document.createElement("div");
    p.className="particle";
    const s=Math.random()*4+2;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;animation-duration:${12+Math.random()*18}s;animation-delay:${Math.random()*20}s;opacity:${0.06+Math.random()*0.1};`;
    wrap.appendChild(p);
  }
})();

/* confetti */
let confettiActive=false;
const cc=document.getElementById("confetti-canvas");
const ctx2=cc.getContext("2d");
let cparts=[];

function launchConfetti(){
  cc.style.display="block";
  cc.width=window.innerWidth;
  cc.height=window.innerHeight;
  confettiActive=true;
  const colors=["#34d399","#38bdf8","#fbbf24","#f472b6","#a78bfa"];
  for(let i=0;i<130;i++){
    cparts.push({
      x:Math.random()*cc.width,y:cc.height*Math.random()*-.5-20,
      w:7+Math.random()*9,h:4+Math.random()*5,
      r:Math.random()*Math.PI*2,
      dr:(.03+Math.random()*.06)*(Math.random()<.5?1:-1),
      vx:(Math.random()-.5)*3,vy:2+Math.random()*3,
      color:colors[Math.floor(Math.random()*colors.length)]
    });
  }
  rafConfetti();
}

function rafConfetti(){
  if(!confettiActive)return;
  ctx2.clearRect(0,0,cc.width,cc.height);
  let alive=0;
  cparts.forEach(p=>{
    p.x+=p.vx;p.y+=p.vy;p.r+=p.dr;p.vy+=.05;
    if(p.y<cc.height+20)alive++;
    ctx2.save();
    ctx2.globalAlpha=Math.max(0,1-(p.y/(cc.height*.9)));
    ctx2.translate(p.x,p.y);ctx2.rotate(p.r);
    ctx2.fillStyle=p.color;
    ctx2.fillRect(-p.w/2,-p.h/2,p.w,p.h);
    ctx2.restore();
  });
  if(alive>0)requestAnimationFrame(rafConfetti);
  else{cc.style.display="none";confettiActive=false;}
}

/* finish sequence */
let finishShown=false;
function showFinish(){
  if(finishShown)return;
  finishShown=true;
  const overlay=document.getElementById("finish-overlay");
  const word=document.getElementById("done-word");
  const msg=document.getElementById("done-msg");
  const stars=document.getElementById("done-stars");
  overlay.classList.add("visible");
  launchConfetti();
  setTimeout(()=>word.classList.add("show"),100);
  setTimeout(()=>word.classList.add("fade-out"),1800);
  setTimeout(()=>{word.style.display="none";msg.classList.add("show");stars.classList.add("show");},2500);
}

/* countdown */
let cur="all";
let timer=null;
let prev={d:"",h:"",m:"",s:""};

function pad(n){return n<10?"0"+n:""+n;}

function bumpBox(id){
  const el=document.getElementById(id).parentElement;
  el.classList.add("bump");
  setTimeout(()=>el.classList.remove("bump"),120);
}

function tick(){
  if(Date.now()>=EXAM_END){showFinish();return;}
  const diff=new Date(CFG[cur].date).getTime()-Date.now();
  if(diff<=0){
    ["cd-d","cd-h","cd-m","cd-s"].forEach(id=>document.getElementById(id).textContent="00");
    return;
  }
  const d=pad(Math.floor(diff/86400000));
  const h=pad(Math.floor(diff%86400000/3600000));
  const m=pad(Math.floor(diff%3600000/60000));
  const s=pad(Math.floor(diff%60000/1000));
  if(d!==prev.d){document.getElementById("cd-d").textContent=d;bumpBox("cd-d");}
  if(h!==prev.h){document.getElementById("cd-h").textContent=h;bumpBox("cd-h");}
  if(m!==prev.m){document.getElementById("cd-m").textContent=m;bumpBox("cd-m");}
  if(s!==prev.s){document.getElementById("cd-s").textContent=s;bumpBox("cd-s");}
  prev={d,h,m,s};
  const pct=Math.min(100,Math.max(0,((30*86400000-diff)/(30*86400000))*100));
  document.getElementById("prog").style.width=pct+"%";
}

function setMode(m){
  cur=m;prev={d:"",h:"",m:"",s:""};
  document.getElementById("dot").style.background=CFG[m].dot;
  document.getElementById("chip").textContent=CFG[m].note;
  document.getElementById("prog").style.background=CFG[m].prog;
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("active",b.dataset.m===m));
  clearInterval(timer);tick();timer=setInterval(tick,1000);
}

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>setMode(b.dataset.m)));
setMode("all");
</script>
</body>
</html>
