<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Đếm Ngược THPT 2026 — Võ Minh Triết</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    /* =============================================
       RESET & BASE
    ============================================= */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --c-bg:        #05070e;
      --c-card:      rgba(15, 20, 35, 0.45);
      --c-border:    rgba(255, 255, 255, 0.08);
      --c-muted:     rgba(148,163,184,0.75);
      --c-hint:      rgba(148, 163, 184, 0.8);
      --font-ui:     'Space Grotesk', sans-serif;
      --font-mono:   'JetBrains Mono', monospace;
      --radius-lg:   24px;
      --radius-md:   16px;
      --radius-sm:   10px;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--c-bg);
      color: #f8fafc;
      font-family: var(--font-ui);
      overflow: hidden;
    }

    /* =============================================
       BACKGROUND LAYERS (Animated Mesh)
    ============================================= */
    #bg-img {
      position: fixed; inset: 0; z-index: 0;
      background: linear-gradient(-45deg, #070b19, #0f172a, #1e1b4b, #09090e);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    #bg-canvas {
      position: fixed; inset: 0; z-index: 1;
      pointer-events: none;
      opacity: 0.8;
    }

    #vignette {
      position: fixed; inset: 0; z-index: 2; pointer-events: none;
      background: radial-gradient(circle at center, transparent 30%, rgba(5,7,14,0.9) 100%);
    }

    /* =============================================
       MAIN CARD & ANIMATIONS
    ============================================= */
    .page {
      position: relative; z-index: 3;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 20px 16px;
    }

    @keyframes slideUpFade {
      from { opacity: 0; transform: translateY(40px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .card {
      width: 100%; max-width: 720px;
      background: var(--c-card);
      border: 1px solid var(--c-border);
      border-top: 1px solid rgba(255,255,255,0.15);
      border-left: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      padding: 40px 36px;
      display: flex; flex-direction: column; align-items: center;
      box-shadow: 0 40px 100px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.05);
      animation: slideUpFade 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* =============================================
       HEADER
    ============================================= */
    .badge-school {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase;
      padding: 6px 16px; border-radius: 30px;
      border: 1px solid rgba(56,189,248,0.4);
      color: #7dd3fc;
      background: rgba(56,189,248,0.1);
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(56,189,248,0.2);
    }

    .main-title {
      font-size: 2rem; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; text-align: center;
      background: linear-gradient(135deg, #fff 0%, #a5b4fc 50%, #6ee7b7 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 12px; letter-spacing: 3px; text-transform: uppercase;
      color: var(--c-hint); margin-bottom: 28px; font-weight: 500;
    }

    /* =============================================
       TABS (Modern Segmented Control)
    ============================================= */
    .tabs {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 8px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-lg);
      padding: 6px;
      margin-bottom: 24px;
      box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
    }

    .tab {
      font-family: var(--font-ui);
      font-size: 12px; font-weight: 600; letter-spacing: 1px;
      text-transform: uppercase;
      padding: 10px 18px; border-radius: var(--radius-md);
      border: 1px solid transparent; background: transparent;
      color: rgba(148,163,184,0.7);
      cursor: pointer;
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      white-space: nowrap;
    }
    .tab:hover { color: #fff; background: rgba(255,255,255,0.05); }

    .tab.a-all  { background: rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.3); color: #6ee7b7; text-shadow: 0 0 10px rgba(52,211,153,0.4); }
    .tab.a-toan { background: rgba(248,113,113,0.15); border-color: rgba(248,113,113,0.3); color: #fca5a5; text-shadow: 0 0 10px rgba(248,113,113,0.4); }
    .tab.a-ly   { background: rgba(56,189,248,0.15); border-color: rgba(56,189,248,0.3); color: #7dd3fc; text-shadow: 0 0 10px rgba(56,189,248,0.4); }
    .tab.a-hoa  { background: rgba(52,211,153,0.15); border-color: rgba(52,211,153,0.3); color: #6ee7b7; text-shadow: 0 0 10px rgba(52,211,153,0.4); }
    .tab.a-anh  { background: rgba(251,191,36,0.15);  border-color: rgba(251,191,36,0.3);  color: #fde047; text-shadow: 0 0 10px rgba(251,191,36,0.4); }

    /* =============================================
       INFO CHIP
    ============================================= */
    .info-row {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 20px;
    }
    .info-dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      transition: background .4s, box-shadow .4s;
    }
    .info-chip {
      font-size: 12.5px; font-weight: 500; line-height: 1.5;
      color: rgba(226, 232, 240, 0.9);
      background: linear-gradient(90deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: var(--radius-sm);
      padding: 8px 16px;
    }
    .info-chip b { font-weight: 700; color: #fff; }

    /* =============================================
       PROGRESS BAR
    ============================================= */
    .prog-wrap {
      width: 100%; max-width: 540px;
      margin-bottom: 28px;
    }
    .prog-track {
      height: 6px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px; overflow: hidden;
      box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
    }
    .prog-fill {
      height: 100%; border-radius: 4px;
      transition: width 1s cubic-bezier(0.4, 0, 0.2, 1), background .4s, box-shadow .4s;
      position: relative;
    }
    /* Thêm hiệu ứng chớp sáng chạy dọc thanh tiến trình */
    .prog-fill::after {
      content: ''; position: absolute; top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

    /* =============================================
       CLOCK GRID
    ============================================= */
    .clock-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
      width: 100%; max-width: 540px;
      margin-bottom: 32px;
    }

    .clock-box {
      background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(0,0,0,0.3) 100%);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius-md);
      padding: 24px 10px 18px;
      text-align: center;
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
      backdrop-filter: blur(10px);
    }
    .clock-box:hover { 
      transform: translateY(-6px) scale(1.02); 
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, rgba(0,0,0,0.4) 100%);
    }

    .clock-num {
      font-family: var(--font-mono);
      font-size: 3.5rem; font-weight: 700; line-height: 1;
      transition: color .4s, text-shadow .4s;
    }
    .clock-lbl {
      font-size: 10px; text-transform: uppercase; letter-spacing: 3px;
      color: var(--c-hint);
      margin-top: 14px; font-weight: 600;
    }

    /* Đổi màu số và tạo viền sáng khi hover theo từng môn */
    .theme-all  .clock-num { color: #6ee7b7; text-shadow: 0 0 25px rgba(52,211,153,0.6); }
    .theme-all  .clock-box:hover { border-color: rgba(52,211,153,0.4); box-shadow: 0 10px 30px rgba(52,211,153,0.15); }
    .theme-all  .info-dot { box-shadow: 0 0 12px #6ee7b7; }
    
    .theme-toan .clock-num { color: #fca5a5; text-shadow: 0 0 25px rgba(248,113,113,0.6); }
    .theme-toan .clock-box:hover { border-color: rgba(248,113,113,0.4); box-shadow: 0 10px 30px rgba(248,113,113,0.15); }
    .theme-toan .info-dot { box-shadow: 0 0 12px #fca5a5; }

    .theme-ly   .clock-num { color: #7dd3fc; text-shadow: 0 0 25px rgba(56,189,248,0.6); }
    .theme-ly   .clock-box:hover { border-color: rgba(56,189,248,0.4); box-shadow: 0 10px 30px rgba(56,189,248,0.15); }
    .theme-ly   .info-dot { box-shadow: 0 0 12px #7dd3fc; }

    .theme-hoa  .clock-num { color: #6ee7b7; text-shadow: 0 0 25px rgba(52,211,153,0.6); }
    .theme-hoa  .clock-box:hover { border-color: rgba(52,211,153,0.4); box-shadow: 0 10px 30px rgba(52,211,153,0.15); }
    .theme-hoa  .info-dot { box-shadow: 0 0 12px #6ee7b7; }

    .theme-anh  .clock-num { color: #fde047; text-shadow: 0 0 25px rgba(251,191,36,0.6); }
    .theme-anh  .clock-box:hover { border-color: rgba(251,191,36,0.4); box-shadow: 0 10px 30px rgba(251,191,36,0.15); }
    .theme-anh  .info-dot { box-shadow: 0 0 12px #fde047; }

    .finish-msg {
      display: none;
      font-size: 1.5rem; font-weight: 700;
      color: #6ee7b7;
      text-shadow: 0 0 20px rgba(52,211,153,0.6);
      text-align: center;
      padding: 30px 0;
      margin-bottom: 24px;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }

    /* =============================================
       QUICK LINKS
    ============================================= */
    .links-row {
      display: flex; flex-wrap: wrap; justify-content: center; gap: 12px;
      margin-bottom: 28px;
    }

    .link-btn {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--font-ui);
      font-size: 12px; font-weight: 600; letter-spacing: 0.5px;
      padding: 10px 20px; border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.03);
      color: rgba(226,232,240,0.9);
      text-decoration: none;
      transition: all .3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .link-btn:hover {
      background: rgba(255,255,255,0.1); color: #fff;
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }
    .link-btn.lk-web:hover   { border-color: #38bdf8; box-shadow: 0 5px 20px rgba(56,189,248,0.2); }
    .link-btn.lk-score:hover { border-color: #34d399; box-shadow: 0 5px 20px rgba(52,211,153,0.2); }
    .link-btn.lk-admit:hover { border-color: #fbbf24; box-shadow: 0 5px 20px rgba(251,191,36,0.2); }

    /* =============================================
       FOOTER
    ============================================= */
    .divider {
      width: 100%; max-width: 540px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      margin: 0 0 24px 0;
    }

    .footer-row {
      display: flex; align-items: center; gap: 16px;
    }

    .gl-text {
      font-family: var(--font-ui);
      font-size: 14px; font-weight: 700; letter-spacing: 5px;
      text-transform: uppercase;
      background: linear-gradient(90deg,#fca5a5,#a5b4fc,#6ee7b7,#fde047,#fca5a5);
      background-size: 300% auto;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: shine 4s linear infinite;
    }
    @keyframes shine { from { background-position: 0 center; } to { background-position: 300% center; } }

    .author { font-size: 11px; color: var(--c-hint); letter-spacing: 1px; }
    .author strong { color: rgba(241,245,249,0.9); font-weight: 600; }

    /* =============================================
       RESPONSIVE
    ============================================= */
    @media (max-width: 640px) {
      .card { padding: 32px 20px; }
      .main-title { font-size: 1.5rem; }
      .clock-num { font-size: 2.5rem; }
      .clock-grid { gap: 10px; }
      .tab { padding: 8px 14px; font-size: 11px; }
    }
    @media (max-width: 400px) {
      .clock-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .main-title { font-size: 1.3rem; }
      .subtitle { font-size: 10px; }
    }
  </style>
</head>

<body>
  <div id="bg-img"></div>
  <canvas id="bg-canvas"></canvas>
  <div id="vignette"></div>

  <div class="page">
    <div class="card" id="card">

      <span class="badge-school">HCMUS — ĐH Khoa học Tự nhiên · ĐHQG-HCM</span>
      <h1 class="main-title" id="main-title">Đếm ngược kỳ thi TN THPT 2026</h1>
      <p class="subtitle">Khối A00 &amp; A01 &nbsp;·&nbsp; Võ Minh Triết</p>

      <nav class="tabs" id="tabs">
        <button class="tab a-all"  data-m="all" >📋 Thủ tục</button>
        <button class="tab"        data-m="toan">∫ Toán</button>
        <button class="tab"        data-m="ly"  >ψ Vật lý</button>
        <button class="tab"        data-m="hoa" >Δ Hóa học</button>
        <button class="tab"        data-m="anh" >🇬🇧 Tiếng Anh</button>
      </nav>

      <div class="info-row">
        <span class="info-dot" id="dot"></span>
        <span class="info-chip" id="chip"></span>
      </div>

      <div class="prog-wrap">
        <div class="prog-track"><div class="prog-fill" id="prog"></div></div>
      </div>

      <div class="clock-grid" id="clock">
        <div class="clock-box"><div class="clock-num" id="cd-d">00</div><div class="clock-lbl">Ngày</div></div>
        <div class="clock-box"><div class="clock-num" id="cd-h">00</div><div class="clock-lbl">Giờ</div></div>
        <div class="clock-box"><div class="clock-num" id="cd-m">00</div><div class="clock-lbl">Phút</div></div>
        <div class="clock-box"><div class="clock-num" id="cd-s">00</div><div class="clock-lbl">Giây</div></div>
      </div>
      <div class="finish-msg" id="done">🎉 Đã đến giờ! Chúc bạn làm bài thật tốt! 🚀</div>

      <div class="divider"></div>

      <div class="links-row">
        <a class="link-btn lk-web"   href="https://hcmus.edu.vn"                                     target="_blank" rel="noopener">🏛️ Website HCMUS</a>
        <a class="link-btn lk-score" href="https://tuyensinh.hcmus.edu.vn/2025-diem-chuan-cac-phuong-thuc/" target="_blank" rel="noopener">📊 Điểm chuẩn 2025</a>
        <a class="link-btn lk-admit" href="https://tuyensinh.hcmus.edu.vn"                                 target="_blank" rel="noopener">🎓 Tuyển sinh</a>
      </div>

      <div class="footer-row">
        <span class="gl-text">✦ Good Luck ✦</span>
        <span class="author">developed by <strong>Võ Minh Triết</strong></span>
      </div>

    </div>
  </div>

  <script>
    // =============================================
    // LỊCH THI CHÍNH THỨC 2026 (Công văn 1257/BGDĐT-QLCL)
    // =============================================
    const CFG = {
      all:  { date: "2026-06-10T14:00:00", theme: "all",  dot: "#6ee7b7", prog: "rgba(52,211,153,0.9)",
              note: "Chiều <b>10/6/2026 — 14:00</b> &nbsp;·&nbsp; Thí sinh có mặt làm thủ tục, nghe phổ biến quy chế" },
      toan: { date: "2026-06-11T14:30:00", theme: "toan", dot: "#fca5a5", prog: "rgba(248,113,113,0.9)",
              note: "Chiều <b>11/6/2026 — 14:30</b> &nbsp;·&nbsp; Phát đề 14h20 &nbsp;·&nbsp; 90 phút &nbsp;·&nbsp; Khối A00 &amp; A01" },
      ly:   { date: "2026-06-12T07:35:00", theme: "ly",   dot: "#7dd3fc", prog: "rgba(56,189,248,0.9)",
              note: "Sáng <b>12/6/2026 — 07:35</b> &nbsp;·&nbsp; Phát đề 07h30 &nbsp;·&nbsp; 50 phút &nbsp;·&nbsp; Môn tự chọn 1 · A00 &amp; A01" },
      hoa:  { date: "2026-06-12T08:40:00", theme: "hoa",  dot: "#6ee7b7", prog: "rgba(52,211,153,0.9)",
              note: "Sáng <b>12/6/2026 — 08:40</b> &nbsp;·&nbsp; Phát đề 08h35 &nbsp;·&nbsp; 50 phút &nbsp;·&nbsp; Môn tự chọn 2 · Khối A00" },
      anh:  { date: "2026-06-12T08:40:00", theme: "anh",  dot: "#fde047", prog: "rgba(251,191,36,0.9)",
              note: "Sáng <b>12/6/2026 — 08:40</b> &nbsp;·&nbsp; Phát đề 08h35 &nbsp;·&nbsp; 50 phút &nbsp;·&nbsp; Môn tự chọn 2 · Khối A01" }
    };

    const START = new Date("2026-01-01T00:00:00").getTime();
    let cur = "all", timer = null;
    const pad = n => n < 10 ? "0" + n : String(n);

    function tick() {
      const c    = CFG[cur];
      const now  = Date.now();
      const end  = new Date(c.date).getTime();
      const diff = end - now;

      if (diff <= 0) {
        document.getElementById("clock").style.display = "none";
        document.getElementById("done").style.display  = "block";
        document.getElementById("prog").style.width    = "100%";
        document.getElementById("prog").style.boxShadow = `0 0 15px ${c.prog}`;
        return;
      }
      document.getElementById("clock").style.display = "grid";
      document.getElementById("done").style.display  = "none";

      const pct = Math.min(100, Math.max(0, ((end - START - diff) / (end - START)) * 100));
      document.getElementById("prog").style.width = pct.toFixed(3) + "%";
      document.getElementById("prog").style.boxShadow = `0 0 15px ${c.dot}`;

      document.getElementById("cd-d").textContent = pad(Math.floor(diff / 86400000));
      document.getElementById("cd-h").textContent = pad(Math.floor((diff % 86400000) / 3600000));
      document.getElementById("cd-m").textContent = pad(Math.floor((diff % 3600000) / 60000));
      document.getElementById("cd-s").textContent = pad(Math.floor((diff % 60000) / 1000));
    }

    function setMode(m) {
      cur = m;
      const c = CFG[m];
      document.getElementById("card").className        = "card theme-" + c.theme;
      document.getElementById("dot").style.background  = c.dot;
      document.getElementById("chip").innerHTML         = c.note;
      document.getElementById("prog").style.background = c.prog;
      document.querySelectorAll(".tab").forEach(b => {
        b.className = b.dataset.m === m ? "tab a-" + c.theme : "tab";
      });
      clearInterval(timer);
      tick();
      timer = setInterval(tick, 1000);
    }

    document.getElementById("tabs").addEventListener("click", e => {
      const b = e.target.closest(".tab");
      if (b) setMode(b.dataset.m);
    });

    setMode("all");

    // ---- Particles ----
    const CV  = document.getElementById("bg-canvas");
    const CTX = CV.getContext("2d");
    const P_COL = { all:"110,231,183", toan:"252,165,165", ly:"125,211,252", hoa:"110,231,183", anh:"253,224,71" };

    function resizeCV() { CV.width = window.innerWidth; CV.height = window.innerHeight; }
    resizeCV();
    window.addEventListener("resize", resizeCV);

    const pts = Array.from({ length: 80 }, () => ({
      x: Math.random() * innerWidth,  y: Math.random() * innerHeight,
      r: Math.random() * 2 + 0.5,
      vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3,
      a: Math.random() * .4 + .1
    }));

    (function loop() {
      CTX.clearRect(0, 0, CV.width, CV.height);
      const col = P_COL[cur] || "110,231,183";
      pts.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        if (p.x < 0 || p.x > CV.width)  { p.x = Math.random() * CV.width;  p.vx *= -1; }
        if (p.y < 0 || p.y > CV.height) { p.y = Math.random() * CV.height; p.vy *= -1; }
        CTX.beginPath();
        CTX.arc(p.x, p.y, p.r, 0, 6.283);
        CTX.fillStyle = `rgba(${col},${p.a})`;
        CTX.fill();
      });
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
